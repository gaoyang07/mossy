<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSS - Reachy Mini</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MOSS</h1>
            <p class="subtitle">Reachy Mini · MOSS-Live 语音对话</p>
        </header>

        <div class="voice-panel">
            <div class="voice-info">
                <span class="status-dot" id="status-dot"></span>
                <span class="voice-status" id="status-text">连接中…</span>
            </div>
            <div class="voice-actions">
                <button class="remove-btn" id="mute-btn">静音麦克风</button>
            </div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="message system">
                <span class="content">对着机器人说话即可，语音识别与回复都在 MOSS-Live 服务端完成。</span>
            </div>
        </div>

        <div class="status-bar" id="latency"></div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
